<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Groq API Tester</title>
    <style>
        body { font-family: sans-serif; max-width: 800px; margin: 2rem auto; padding: 0 1rem; line-height: 1.6; }
        .container { border: 1px solid #ccc; padding: 2rem; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        textarea { width: 100%; height: 100px; margin-bottom: 1rem; padding: 0.5rem; border-radius: 4px; border: 1px solid #ddd; }
        button { background-color: #f55036; color: white; border: none; padding: 0.75rem 1.5rem; border-radius: 4px; cursor: pointer; font-size: 1rem; }
        button:hover { background-color: #d43d25; }
        button:disabled { background-color: #ccc; cursor: not-allowed; }
        #response-area { margin-top: 2rem; background: #f9f9f9; padding: 1rem; border-radius: 4px; min-height: 50px; white-space: pre-wrap; }
        .error { color: red; }
    </style>
</head>
<body>

<div class="container">
    <h2>Groq API Key Tester</h2>
    <p>Enter your prompt below to test the API connection.</p>
    
    <textarea id="userPrompt" placeholder="Type your prompt here (e.g., Tell me a joke)..."></textarea>
    
    <button id="submitBtn" onclick="sendRequest()">Send Request</button>

    <div id="response-area">Response will appear here...</div>
</div>

<script>
    // PASTE YOUR API KEY HERE
    const apiKey = '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'; 

    async function sendRequest() {
        const prompt = document.getElementById('userPrompt').value;
        const responseArea = document.getElementById('response-area');
        const btn = document.getElementById('submitBtn');

        if (!prompt) {
            alert("Please enter a prompt.");
            return;
        }

        // UI Updates
        responseArea.textContent = "Thinking...";
        responseArea.classList.remove('error');
        btn.disabled = true;

        try {
            const response = await fetch('https://api.groq.com/openai/v1/chat/completions', {
                method: 'POST',
                headers: {
                    'Authorization': `Bearer ${apiKey}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    messages: [
                        {
                            role: "user",
                            content: prompt
                        }
                    ],
                    model: "llama3-8b-8192" // You can change this to 'mixtral-8x7b-32768' or others
                })
            });

            if (!response.ok) {
                const errorData = await response.json();
                throw new Error(errorData.error?.message || `HTTP error! status: ${response.status}`);
            }

            const data = await response.json();
            const aiResponse = data.choices[0].message.content;
            
            responseArea.textContent = aiResponse;

        } catch (error) {
            console.error(error);
            responseArea.textContent = "Error: " + error.message;
            responseArea.classList.add('error');
        } finally {
            btn.disabled = false;
        }
    }
</script>

</body>
</html>
