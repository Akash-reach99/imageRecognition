<h2>Scan Results</h2>

<img src="{{ result_img }}" style="max-width: 500px;">

<h3>Detailed Data:</h3>
<table border="1">
    <tr>
        <th>Text Detected</th>
        <th>Confidence</th>
    </tr>
    {% for item in data %}
    <tr>
        <td>{{ item.text }}</td>
        <td>{{ item.confidence }}</td>
    </tr>
    {% endfor %}
</table>
